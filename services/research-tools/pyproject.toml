[project]
name = "research-tools"
version = "0.1.0"
description = "Research tools for agents over HTTP: YouTube search and transcripts, web search and page text, each answer cut into passages an agent can quote and check a claim against."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false
